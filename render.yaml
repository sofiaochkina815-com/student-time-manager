databases:
  - name: student-time-db
    plan: free
    databaseName: student_time
    user: student_time
services:
  - type: web
    name: student-time-manager
    runtime: python
    plan: free
    buildCommand: ./scripts/build.sh
    startCommand: ./scripts/start.sh
    healthCheckPath: /health/ready/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: PRIVATE_FILE_STORAGE
        value: database
      - key: TRUST_FORWARDED_PROTO
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: student-time-db
          property: connectionString
